name: Report a problem
description: Something on smallwebp.io isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Issues are public, so **please don't attach private images**.
        For a security problem, use [private reporting](https://github.com/popcornbag8891-blip/SmallWebP/security) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I dropped a 4 MB PNG in Lossless mode and the card stayed on "Encoding"…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open smallwebp.io
        2. Choose High quality, Q80
        3. Drop a JPG
    validations:
      required: false
  - type: dropdown
    id: format
    attributes:
      label: File type
      multiple: true
      options: [JPG / JPEG, PNG, GIF (still), GIF (animated), BMP, WebP, AVIF, Other / not sure]
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Rough file size and dimensions
      placeholder: 4 MB, 3000×2000
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Lossless, Near-lossless, High quality, Not sure]
    validations:
      required: true
  - type: dropdown
    id: optimize
    attributes:
      label: Color optimization
      options: [On (default), Off, Not sure]
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Firefox, Safari, Samsung Internet, Other]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system
      placeholder: iPhone 15, iOS 19 · or · Windows 11 laptop
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Error messages
      description: Any message shown on the file card, or errors from the browser console (F12 → Console).
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I haven't attached any private or personal images.
          required: true
